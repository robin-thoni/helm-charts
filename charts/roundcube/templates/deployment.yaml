apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roundcube.fullname" . }}
  labels:
    {{- include "roundcube.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "roundcube.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "roundcube.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "roundcube.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default (print .Chart.AppVersion "-apache") }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if hasKey .Values.environment "ROUNDCUBEMAIL_DB_PASSWORD" }}
          {{- fail "Set ROUNDCUBEMAIL_DB_PASSWORD through secrets.env, not environment" }}
          {{- end }}
          {{- if hasKey .Values.environment "ROUNDCUBEMAIL_OAUTH_CLIENT_SECRET" }}
          {{- fail "Set ROUNDCUBEMAIL_OAUTH_CLIENT_SECRET through secrets.env, not environment" }}
          {{- end }}
          {{- if hasKey .Values.environment "ROUNDCUBEMAIL_DES_KEY" }}
          {{- fail "Set ROUNDCUBEMAIL_DES_KEY through secrets.env, not environment" }}
          {{- end }}
          {{- $environment := dict }}
          {{- range $name, $value := .Values.environment }}
          {{- if ne (toString $value) "" }}
          {{- $_ := set $environment $name $value }}
          {{- end }}
          {{- end }}
          {{- if or $environment .Values.secrets.env }}
          env:
            {{- range $name, $value := $environment }}
            - name: {{ $name | quote }}
              value: {{ $value | quote }}
            {{- end }}
            {{- range .Values.secrets.env }}
            - name: {{ required "Each secrets.env entry needs a name" .name | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ required "Each secrets.env entry needs a secretName" .secretName | quote }}
                  key: {{ required "Each secrets.env entry needs a key" .key | quote }}
                  optional: {{ .optional | default false }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or .Values.volumeMounts .Values.advancedConfig.configMap .Values.advancedConfig.createConfigMap .Values.advancedConfig.phpIni.configMap .Values.advancedConfig.phpIni.createConfigMap }}
          volumeMounts:
            {{- if or .Values.advancedConfig.configMap .Values.advancedConfig.createConfigMap }}
            - name: roundcube-extra-config
              mountPath: /var/roundcube/config
              readOnly: true
            {{- end }}
            {{- if or .Values.advancedConfig.phpIni.configMap .Values.advancedConfig.phpIni.createConfigMap }}
            - name: roundcube-php-ini
              mountPath: {{ printf "/usr/local/etc/php/conf.d/%s" .Values.advancedConfig.phpIni.filename | quote }}
              subPath: {{ .Values.advancedConfig.phpIni.filename | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- if or .Values.volumes .Values.advancedConfig.configMap .Values.advancedConfig.createConfigMap .Values.advancedConfig.phpIni.configMap .Values.advancedConfig.phpIni.createConfigMap }}
      volumes:
        {{- if or .Values.advancedConfig.configMap .Values.advancedConfig.createConfigMap }}
        - name: roundcube-extra-config
          configMap:
            name: {{ if .Values.advancedConfig.createConfigMap }}{{ include "roundcube.advancedConfigMapName" . | quote }}{{ else }}{{ .Values.advancedConfig.configMap | quote }}{{ end }}
        {{- end }}
        {{- if or .Values.advancedConfig.phpIni.configMap .Values.advancedConfig.phpIni.createConfigMap }}
        - name: roundcube-php-ini
          configMap:
            name: {{ if .Values.advancedConfig.phpIni.createConfigMap }}{{ include "roundcube.phpIniConfigMapName" . | quote }}{{ else }}{{ .Values.advancedConfig.phpIni.configMap | quote }}{{ end }}
            items:
              - key: {{ required "advancedConfig.phpIni.key is required when advancedConfig.phpIni.configMap is set" .Values.advancedConfig.phpIni.key | quote }}
                path: {{ .Values.advancedConfig.phpIni.filename | quote }}
        {{- end }}
        {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
